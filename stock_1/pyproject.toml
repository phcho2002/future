[project]
name = "stock-chan-selector"
version = "0.1.0"
description = "AkShare daily A-share selector using strict Chan-style moving-average winding breakout rules."
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
