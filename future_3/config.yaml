# =====================================================================
# 双均线缠绕放量突破系统 配置文件
# 默认运行在 30 分钟 K 线
# =====================================================================

# ---------- 数据来源 ----------
data:
  db_path: "futures_data.db"          # 品种表所在 SQLite 库
  symbol_table: "futures_top40"      # 读取的品种表 (futures_top40 / futures_all)
  symbol_col: "symbol"
  name_col: "name"
  exchange_col: "exchange"
  period: "30"                       # K线周期 (30分钟)
  cache_dir: "cache"                 # K线 parquet 缓存目录（akshare 回退路径用）
  cache_ttl_hours: 2                 # 缓存超时(小时)，超过则重新联网拉取
  fetch_retries: 2                   # 单品种拉取失败重试次数
  backend: "xtquant"                 # 数据后端: xtquant(默认, 含共享缓存) / akshare(备份)

# ---------- 策略默认参数 (optimize.py 会把网格最优结果写回这里) ----------
# 当前为 Top40 网格优化最优结果 (PF=2.005, 168笔, 胜率47%)
strategy:
  ema_fast: 9                        # 短期均线 EMA (优化最优)
  ema_slow: 23                       # 长期均线 EMA (优化最优)

  # 缠绕带
  twist_window: 30                   # 回看窗口(根)
  min_crossings: 3                   # 窗口内最小交叉次数
  twist_band_ratio: 0.015            # 均线密集度上界(max|fast-slow|/close)，宽松过滤防伪缠绕

  # 放量中阳 / 中阴
  vol_factor: 1.3                    # 放量因子 (优化最优): volume > vol_factor * MA(vol)
  vol_ma: 20                         # 成交量均线周期
  body_pct: 0.006                    # 中阳/中阴实体占比阈值 (优化最优, 0.6%)
  bar_window: 5                      # 金叉前后 ±N 根 K 线内出现放量K

  # 加分项
  bonus_higher_low: true             # 多头: 缠绕带内底部抬高加分
  bonus_lower_high: true             # 空头: 缠绕带内高点降低加分
  swing_lookback: 5                  # 判断局部极值的左右窗口

# ---------- 回测 / 退出模型 ----------
backtest:
  atr_period: 14
  atr_stop_mult: 1.5                 # 初始止损 = 入场价 ± atr_stop_mult * ATR
  trailing_enable: true              # 跟踪止盈
  trailing_atr_mult: 1.5             # 跟踪: 止损 = max(止损, 极值价 ∓ trailing_atr_mult*ATR)
  require_index_atr: true            # 进场前至少需要 atr_period 根数据

# ---------- 优化 ----------
optimize:
  run_table: "futures_top40"         # 参与优化的品种表
  grid:
    ema_fast:    [5, 6, 7, 8, 9, 10]
    ema_slow:    [18, 20, 21, 23, 26, 30]
    vol_factor:  [1.3, 1.5, 1.8, 2.0]
    body_pct:    [0.004, 0.006, 0.008, 0.010]
  fixed:                             # 优化时不动的参数
    twist_window: 30
    min_crossings: 3
    vol_ma: 20
    bar_window: 5
  # 选优约束(防过拟合/小样本)
  min_trades: 30                     # 全局聚合样本数下限
  min_winrate: 0.35                  # 胜率下限
  metric: "profit_factor"            # 主排序指标: profit_factor / sharpe / expectancy_r
  workers: 4                         # 并行(品种数据已缓存, 主要为 CPU 计算)

# ---------- 输出 ----------
output:
  dir: "output"
  signals_csv: "signals_latest.csv"
  optimization_csv: "optimization_report.csv"
  charts_dir: "charts"
  plot_top_symbols: 10               # 扫描后为前 N 个信号品种画图
